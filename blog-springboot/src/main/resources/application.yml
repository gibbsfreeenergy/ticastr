server:
  port: ${SERVER_PORT:8090}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT_SECONDS:21600}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  session:
    store-type: ${SPRING_SESSION_STORE_TYPE:none}
    data:
      redis:
        namespace: ${SESSION_REDIS_NAMESPACE:ticastr:session}
        repository-type: indexed
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: 10
  mvc:
    static-path-pattern: /**
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog?serverTimezone=Asia/Shanghai&allowMultiQueries=true}
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: ${DB_MINIMUM_IDLE:5}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:180000}
      maximum-pool-size: ${DB_MAXIMUM_POOL_SIZE:10}
      auto-commit: true
      pool-name: BlogHikariPool
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    port: ${MAIL_PORT:587}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:20MB}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

storage:
  active-provider: ${STORAGE_ACTIVE_PROVIDER:local}
  local-root: ${STORAGE_LOCAL_ROOT:./uploads}
  local-public-url: ${STORAGE_LOCAL_PUBLIC_URL:/uploads/}
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    region: ${OSS_REGION:}
    public-url: ${OSS_PUBLIC_URL:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  cos:
    endpoint: ${COS_ENDPOINT:}
    bucket: ${COS_BUCKET:}
    region: ${COS_REGION:}
    public-url: ${COS_PUBLIC_URL:}
    access-key-id: ${COS_SECRET_ID:}
    access-key-secret: ${COS_SECRET_KEY:}
  tos:
    endpoint: ${TOS_ENDPOINT:}
    bucket: ${TOS_BUCKET:}
    region: ${TOS_REGION:}
    public-url: ${TOS_PUBLIC_URL:}
    access-key-id: ${TOS_ACCESS_KEY:}
    access-key-secret: ${TOS_SECRET_KEY:}

website:
  url: ${WEBSITE_URL:http://localhost:8080}

qq:
  app-id: ${QQ_APP_ID:}
  check-token-url: https://graph.qq.com/oauth2.0/me?access_token={access_token}
  user-info-url: https://graph.qq.com/user/get_user_info?openid={openid}&access_token={access_token}&oauth_consumer_key={oauth_consumer_key}

weibo:
  app-id: ${WEIBO_APP_ID:}
  app-secret: ${WEIBO_APP_SECRET:}
  grant-type: authorization_code
  redirect-url: ${WEIBO_REDIRECT_URL:http://localhost:8080/oauth/login/weibo}
  access-token-url: https://api.weibo.com/oauth2/access_token
  user-info-url: https://api.weibo.com/2/users/show.json?uid={uid}&access_token={access_token}

app:
  redis:
    enabled: ${APP_REDIS_ENABLED:false}
    key-prefix: ${APP_REDIS_KEY_PREFIX:ticastr}
    streams:
      prefix: ${APP_REDIS_STREAM_PREFIX:ticastr}
      consumer-group: ${APP_REDIS_STREAM_CONSUMER_GROUP:ticastr-workers-v1}
      consumer-name: ${APP_REDIS_STREAM_CONSUMER_NAME:}
      batch-size: ${APP_REDIS_STREAM_BATCH_SIZE:20}
      claim-timeout-seconds: ${APP_REDIS_STREAM_CLAIM_TIMEOUT_SECONDS:600}
      max-delivery-attempts: ${APP_REDIS_STREAM_MAX_DELIVERY_ATTEMPTS:8}
      poll-timeout-millis: ${APP_REDIS_STREAM_POLL_TIMEOUT_MILLIS:500}
      bridge-interval-ms: ${APP_REDIS_STREAM_BRIDGE_INTERVAL_MS:1000}
      consumer-interval-ms: ${APP_REDIS_STREAM_CONSUMER_INTERVAL_MS:1000}
  deployment-profile: ${DEPLOYMENT_PROFILE:local}
  public-api-url: ${API_PUBLIC_URL:${WEBSITE_URL:http://localhost:8080}}
  owner-user-id: ${OWNER_USER_ID:1}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    nickname: ${BOOTSTRAP_ADMIN_NICKNAME:Administrator}
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:8}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:200}
  outbox:
    dispatch-interval-ms: ${OUTBOX_DISPATCH_INTERVAL_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    claim-timeout-seconds: ${OUTBOX_CLAIM_TIMEOUT_SECONDS:600}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
    max-backoff-seconds: ${OUTBOX_MAX_BACKOFF_SECONDS:300}
  search:
    data-root: ${SEARCH_DATA_ROOT:./data}
    index-path: ${SEARCH_INDEX_PATH:search-index}
    max-query-bytes: ${SEARCH_MAX_QUERY_BYTES:100}
    max-results: ${SEARCH_MAX_RESULTS:20}
  pagination:
    cursor-secret: ${PAGINATION_CURSOR_SECRET:local-dev-cursor-secret-change-me}
    cursor-lifetime-seconds: ${PAGINATION_CURSOR_LIFETIME_SECONDS:900}
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:90}
    max-payload-length: ${AUDIT_MAX_PAYLOAD_LENGTH:8000}
    cleanup-cron: ${AUDIT_CLEANUP_CRON:0 30 3 * * ?}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081}

monitoring:
  token: ${MONITORING_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never
  health:
    redis:
      enabled: ${APP_REDIS_ENABLED:false}
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  metrics:
    tags:
      application: ticastr-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,500ms,1s,5s
