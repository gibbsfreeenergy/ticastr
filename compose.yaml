services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/blog?serverTimezone=Asia/Shanghai&allowMultiQueries=true
      DB_USERNAME: blog
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_REDIS_ENABLED: ${APP_REDIS_ENABLED:-false}
      MONITORING_TOKEN: ${MONITORING_TOKEN:?Set MONITORING_TOKEN in .env}
      DEPLOYMENT_PROFILE: local
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8090}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NICKNAME: ${BOOTSTRAP_ADMIN_NICKNAME:-Administrator}
      STORAGE_ACTIVE_PROVIDER: ${STORAGE_ACTIVE_PROVIDER:-local}
      STORAGE_LOCAL_ROOT: /data/uploads/
      STORAGE_LOCAL_PUBLIC_URL: /uploads/
      SEARCH_DATA_ROOT: /data/search
      WEBSITE_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:8081
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      - search-data:/data/search
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

  blog:
    build:
      context: ./blog-vue
      dockerfile: blog/Dockerfile
      args:
        VITE_QQ_APP_ID: ${VITE_QQ_APP_ID:-}
        VITE_QQ_REDIRECT_URI: ${VITE_QQ_REDIRECT_URI:-http://localhost:8080/oauth/login/qq}
        VITE_WEIBO_APP_ID: ${VITE_WEIBO_APP_ID:-}
        VITE_WEIBO_REDIRECT_URI: ${VITE_WEIBO_REDIRECT_URI:-http://localhost:8080/oauth/login/weibo}
        VITE_TENCENT_CAPTCHA_ID: ${VITE_TENCENT_CAPTCHA_ID:-}
        VITE_MUSIC_API_BASE_URL: ${VITE_MUSIC_API_BASE_URL:-}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ./blog-vue
      dockerfile: admin/Dockerfile
      args:
        VITE_TENCENT_CAPTCHA_ID: ${VITE_TENCENT_CAPTCHA_ID:-}
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
  uploads:
  search-data:
