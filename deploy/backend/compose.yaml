services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  api:
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx640m
      DB_URL: jdbc:mysql://mysql:3306/blog?serverTimezone=Asia/Shanghai&allowMultiQueries=true
      DB_USERNAME: blog
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_MINIMUM_IDLE: 1
      DB_MAXIMUM_POOL_SIZE: 5
      APP_REDIS_ENABLED: ${APP_REDIS_ENABLED:-false}
      MONITORING_TOKEN: ${MONITORING_TOKEN:?Set MONITORING_TOKEN}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-production-like}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?Set API_PUBLIC_URL}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NICKNAME: ${BOOTSTRAP_ADMIN_NICKNAME:-Administrator}
      STORAGE_ACTIVE_PROVIDER: ${STORAGE_ACTIVE_PROVIDER:-local}
      STORAGE_LOCAL_ROOT: /data/uploads/
      STORAGE_LOCAL_PUBLIC_URL: /uploads/
      SEARCH_DATA_ROOT: /data/search
      WEBSITE_URL: ${WEBSITE_URL:?Set WEBSITE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      SESSION_COOKIE_SECURE: "true"
      ASYNC_CORE_POOL_SIZE: 2
      ASYNC_MAX_POOL_SIZE: 4
      ASYNC_QUEUE_CAPACITY: 100
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      - search-data:/data/search
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    mem_limit: 768m

volumes:
  mysql-data:
  uploads:
  search-data:
